<script>
const studentName = localStorage.getItem("studentName");
const studentRoll = localStorage.getItem("studentRoll"); // Unique ID atan
document.getElementById("studentInfo").innerHTML = "<b>Student:</b> " + studentName;

const allQuestions = [
  { q: "Q1: Kawnpui College hi khawi vengah nge a awm?", options: ["A. Chhimveng", "B. Mualvum", "C. Dinthar", "D. Venglai"], ans: "D" },
  { q: "Q2: Undo na", options: ["A. Ctrl + C", "B. Ctrl + Z", "C. Ctrl + S", "D. Ctrl + B"], ans: "B" },
  { q: "Q3: PC Fullform is", options: ["A. Parent Control", "B. Pacific Committee", "C. Personal Computer", "D. Pure Comit"], ans: "C" }
];

function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 1. KEY unique siam - RollNo hmang
const STORAGE_KEY = "exam_" + studentRoll;

// 2. Data awm sa check
let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));

let questions, currentQ, userAnswers, timeLeftArray;

if(savedData) {
  // Data awm sa - Refresh a ni tihna
  questions = savedData.questions;
  currentQ = savedData.currentQ;
  userAnswers = savedData.userAnswers;
  timeLeftArray = savedData.timeLeftArray;
} else {
  // Vawi 1 na - Thar in tan
  questions = shuffleArray(allQuestions);
  currentQ = 0;
  userAnswers = new Array(questions.length).fill("");
  timeLeftArray = new Array(questions.length).fill(30);
}

let timerInterval = null;

// 3. Data save zel na function
function saveProgress() {
  let data = { questions, currentQ, userAnswers, timeLeftArray };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function runTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();

  if(timeLeftArray[currentQ] <= 0) {
    document.getElementById("nextBtn").disabled = false;
    return;
  }

  document.getElementById("nextBtn").disabled = true;
  timerInterval = setInterval(() => {
    timeLeftArray[currentQ]--;
    updateTimerDisplay();
    saveProgress(); // second tin in save
    if(timeLeftArray[currentQ] <= 0) {
      clearInterval(timerInterval);
      document.getElementById("nextBtn").disabled = false;
      saveProgress();
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById("timer").innerText = `Time: ${timeLeftArray[currentQ]}s`;
  document.getElementById("timer").style.color = timeLeftArray[currentQ] <= 10? "#d9534f" : "#0056b3";
}

function renderOptions() {
  let optionsHTML = "";
  questions[currentQ].options.forEach((opt, i) => {
    let val = ["A","B","C","D"][i];
    let checked = userAnswers[currentQ] === val? "checked" : "";
    let selectedClass = userAnswers[currentQ] === val? "selected" : "";
    optionsHTML += `<label class="${selectedClass}"><input type="radio" name="option" value="${val}" ${checked} onclick="saveAnswer('${val}')"> ${opt}</label>`;
  });
  document.getElementById("optionsBox").innerHTML = optionsHTML;
}

function loadQuestion() {
  document.getElementById("qCounter").innerText = `Question ${currentQ + 1} of ${questions.length}`;
  document.getElementById("questionText").innerText = questions[currentQ].q;
  renderOptions();

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").innerText = currentQ === questions.length - 1? "Submit" : "Next";

  runTimer();
}

function saveAnswer(val) {
  userAnswers[currentQ] = val;
  saveProgress(); // chhang apiangin save
  renderOptions();
}

function nextQuestion() {
  if(userAnswers[currentQ] === "") {
    alert("Chhanna thlang hmasa rawh");
    return;
  }
  if(currentQ < questions.length - 1) {
    currentQ++;
    saveProgress();
    loadQuestion();
  } else {
    checkAnswers();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    saveProgress();
    loadQuestion();
  }
}

function checkAnswers() {
  clearInterval(timerInterval);
  localStorage.removeItem(STORAGE_KEY); // Exam zo = delete
  let score = 0;
  for(let i=0; i<questions.length; i++) {
    if(userAnswers[i] === questions[i].ans) score++;
  }
  document.getElementById("quizBox").style.display = "none";
  document.querySelector(".btn-group").style.display = "none";
  document.getElementById("timer").style.display = "none";
  document.getElementById("result").innerHTML = `${studentName}, I Mark: ${score} / ${questions.length}`;
}

loadQuestion();

// 4. Tab khar/Refresh hma in save
window.addEventListener("beforeunload", saveProgress);
</script>
