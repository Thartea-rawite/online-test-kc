<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Exam - Quiz</title>
<style>
  body {font-family: 'Segoe UI', Roboto, Arial, sans-serif; background:#f0f4f8; padding:20px; font-size:17px;}
.container {background:white; max-width:800px; margin:auto; padding:35px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}
.header-quiz {display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #0056b3; padding-bottom:10px;}
.header-quiz h2 {color:#0056b3; font-size:22px; margin:0;}
 #timer {font-size:18px; font-weight:700; color:#d9534f; background:#fdecea; padding:8px 15px; border-radius:8px;}
 #studentInfo {font-size:16px; color:#555;}
 #qCounter {font-size:16px; color:#0056b3; font-weight:700;}
.question {margin:25px 0; font-size:20px; font-weight:600;}
.options label {display:block; margin:12px 0; padding:14px; border:2px solid #ddd; border-radius:8px; cursor:pointer; font-size:17px; transition:0.2s;}
.options input {margin-right:10px; transform:scale(1.2);}
.options label:hover {background:#e7f1ff; border-color:#0056b3;}
.options label.selected {background:#d4e8ff; border-color:#0056b3;}
.btn-group {display:flex; justify-content:space-between; margin-top:30px;}
.btn {padding:14px 30px; background:#0056b3; color:white; border:none; border-radius:8px; font-size:18px; font-weight:700; cursor:pointer;}
.btn:hover {background:#003d82;}
.btn:disabled {background:#ccc; cursor:not-allowed;}
 #result {margin-top:25px; font-size:22px; font-weight:700; color:#0056b3; text-align:center;}
</style>
</head>
<body>
<div class="container">
  <div class="header-quiz">
    <h2>CCC Exam</h2>
    <div id="timer">Time: 30s</div>
  </div>
  <div style="display:flex; justify-content:space-between;">
    <div id="studentInfo"></div>
    <div id="qCounter">Question 1 of 3</div>
  </div>

  <div id="quizBox">
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
  </div>

  <div class="btn-group">
    <button class="btn" id="prevBtn" onclick="prevQuestion()" disabled>Prev</button>
    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
  </div>
  <div id="result"></div>
</div>

<script>
const studentName = localStorage.getItem("studentName");
document.getElementById("studentInfo").innerHTML = "<b>Student:</b> " + studentName;

const questions = [
  { q: "Q1: Kawnpui College hi khawi vengah nge a awm?", options: ["A. Chhimveng", "B. Mualvum", "C. Dinthar", "D. Venglai"], ans: "D" },
  { q: "Q2: Undo na", options: ["A. Ctrl + C", "B. Ctrl + Z", "C. Ctrl + S", "D. Ctrl + B"], ans: "B" },
  { q: "Q3: PC Fullform is", options: ["A. Parent Control", "B. Pacific Committee", "C. Personal Computer", "D. Pure Comit"], ans: "C" }
];

let currentQ = 0;
let userAnswers = ["", "", ""];
let timeLeftArray = [30, 30, 30];
let timerInterval;
let questionVisited = [false, false, false];

function startTimer() {
  if(questionVisited[currentQ]) return;
  questionVisited[currentQ] = true;

  updateTimerDisplay();
  document.getElementById("nextBtn").disabled = true;

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeftArray[currentQ]--;
    updateTimerDisplay();
    if(timeLeftArray[currentQ] <= 0) {
      clearInterval(timerInterval);
      document.getElementById("nextBtn").disabled = false;
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById("timer").innerText = `Time: ${timeLeftArray[currentQ]}s`;
  document.getElementById("timer").style.color = timeLeftArray[currentQ] <= 10? "#d9534f" : "#0056b3";
  if(timeLeftArray[currentQ] <= 0) {
    document.getElementById("nextBtn").disabled = false;
  }
}

function renderOptions() { // Timer affect lo tur, hemi chiah hi update
  let optionsHTML = "";
  questions[currentQ].options.forEach((opt, i) => {
    let val = ["A","B","C","D"][i];
    let checked = userAnswers[currentQ] === val? "checked" : "";
    let selectedClass = userAnswers[currentQ] === val? "selected" : "";
    optionsHTML += `<label class="${selectedClass}"><input type="radio" name="option" value="${val}" ${checked} onclick="saveAnswer('${val}')"> ${opt}</label>`;
  });
  document.getElementById("optionsBox").innerHTML = optionsHTML;
}

function loadQuestion() {
  clearInterval(timerInterval);
  document.getElementById("qCounter").innerText = `Question ${currentQ + 1} of ${questions.length}`;
  document.getElementById("questionText").innerText = questions[currentQ].q;

  renderOptions(); // Options chiah update

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").innerText = currentQ === questions.length - 1? "Submit" : "Next";

  updateTimerDisplay();
  if(timeLeftArray[currentQ] > 0 &&!questionVisited[currentQ]) {
    startTimer(); // Vawikhat nan chiah
  } else if(timeLeftArray[currentQ] <= 0) {
    document.getElementById("nextBtn").disabled = false;
  }
}

function saveAnswer(val) {
  userAnswers[currentQ] = val;
  renderOptions(); // Timer stop lo, option color chiah update
}

function nextQuestion() {
  if(userAnswers[currentQ] === "") {
    alert("Chhanna thlang hmasa rawh");
    return;
  }
  clearInterval(timerInterval);
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  } else {
    checkAnswers();
  }
}

function prevQuestion() {
  clearInterval(timerInterval);
  if(currentQ > 0) {
    currentQ--;
    loadQuestion(); // Timer chhunzawm
  }
}

function checkAnswers() {
  let score = 0;
  for(let i=0; i<questions.length; i++) {
    if(userAnswers[i] === questions[i].ans) score++;
  }
  clearInterval(timerInterval);
  document.getElementById("quizBox").style.display = "none";
  document.querySelector(".btn-group").style.display = "none";
  document.getElementById("timer").style.display = "none";
  document.getElementById("result").innerHTML = `${studentName}, I Mark: ${score} / ${questions.length}`;
}

loadQuestion();
</script>
</body>
</html>
