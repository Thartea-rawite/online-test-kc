<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Exam - Quiz</title>
<style>
  body {font-family: 'Segoe UI', Roboto, Arial, sans-serif; background:#f0f4f8; padding:20px; font-size:17px;}
 .container {background:white; max-width:800px; margin:auto; padding:35px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}
 .header-quiz {text-align:center; margin-bottom:20px;}
 .header-quiz h2 {color:#0056b3; font-size:24px;}
  #studentInfo {text-align:right; font-size:16px; margin-bottom:20px; color:#555;}
 .question {margin:25px 0; font-size:18px; font-weight:600;}
 .options label {display:block; margin:12px 0; padding:12px; border:2px solid #ddd; border-radius:8px; cursor:pointer; font-size:17px; transition:0.2s;}
 .options input {margin-right:10px;}
 .options label:hover {background:#e7f1ff; border-color:#0056b3;}
 .btn {padding:14px 30px; background:#0056b3; color:white; border:none; border-radius:8px; font-size:18px; font-weight:700; cursor:pointer; margin-top:20px;}
 .btn:hover {background:#003d82;}
  #result {margin-top:25px; font-size:22px; font-weight:700; color:#0056b3; text-align:center;}
</style>
</head>
<body>
<div class="container">
  <div class="header-quiz">
  </div>
  <div id="studentInfo"></div>
  
  <form id="quizForm">
    <div class="question">Q1: Kawnpui College hi khawi vengah nge a awm?</div>
    <div class="options">
      <label><input type="radio" name="q1" value="A"> A. Chhimveng</label>
      <label><input type="radio" name="q1" value="B"> B. Mualvum</label>
      <label><input type="radio" name="q1" value="C"> C. Dinthar</label>
      <label><input type="radio" name="q1" value="D"> D. Venglai</label>
    </div>

    <div class="question">Q2: Undo na</div>
    <div class="options">
      <label><input type="radio" name="q2" value="A"> A. Ctrl + C</label>
      <label><input type="radio" name="q2" value="B"> B. Ctrl + Z</label>
      <label><input type="radio" name="q2" value="C"> C. Ctrl + S</label>
      <label><input type="radio" name="q2" value="D"> D. Ctrl + B</label>
    </div>

    <div class="question">Q3: PC Fullform is</div>
    <div class="options">
      <label><input type="radio" name="q3" value="A"> A. Parent Control</label>
      <label><input type="radio" name="q3" value="B"> B. Pacific Committee</label>
      <label><input type="radio" name="q3" value="C"> C. Personal Computer</label>
      <label><input type="radio" name="q3" value="D"> D. Pure Comit</label>
    </div>

    <button type="button" class="btn" onclick="checkAnswers()">Submit Exam</button>
  </form>
  <div id="result"></div>
</div>

<script>
  // Hming lo lang tir
  const studentName = localStorage.getItem("studentName");
  document.getElementById("studentInfo").innerHTML = "<b>Student:</b> " + studentName;

  const answers = {q1: "D", q2: "B", q3: "C"}; // Answer dik

  function checkAnswers() {
    let score = 0;
    let form = document.getElementById("quizForm");
    let total = Object.keys(answers).length;
    
    for(let q in answers) {
      let selected = form[q].value;
      if(selected === answers[q]) score++;
    }
    document.getElementById("result").innerHTML = studentName + ", I Mark: " + score + " / " + total;
  }
</script>
</body>
</html>
